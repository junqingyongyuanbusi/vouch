name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: gofmt check
        # Go through the Makefile so CI and a developer's machine run the same
        # check with the same gofmt (the target resolves it from GOROOT).
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: python deps (pytest)
        run: python3 -m pip install --quiet pytest
      - name: fixture deps (ts-vitest)
        # The TS end-to-end probe test runs a real vitest; without this it skips.
        run: npm install --prefix testdata/fixtures/ts-vitest --no-audit --no-fund
      - name: test
        run: go test ./... -count=1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  goreleaser-dry:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm packages stage correctly from the goreleaser dist
        # Validate the *real* goreleaser dist layout packs all four platforms,
        # that the wrapper launcher is actually committed (an unanchored
        # gitignore once hid it), and that staging never dirties the tree.
        run: |
          git ls-files --error-unmatch npm/vouch/bin/vouch.js
          VERSION=0.0.0-dry DIST=dist STAGE=dist/npm bash scripts/npm/build.sh
          for plat in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            test -x "dist/npm/platforms/vouch-$plat/bin/vouch" || (echo "missing $plat"; exit 1)
          done
          test -z "$(git status --porcelain -- npm scripts)" || (git status --porcelain -- npm scripts; exit 1)
          echo "all four platform packages staged with binaries; tree clean"

  canary:
    # P1.1 hard metric: 3 fixtures + 5 real repos ≥ 7/8 zero-config detection.
    # Needs network; runs nightly and on demand, not on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: canary (zero-config detection ≥7/8)
        run: go test -tags canary ./internal/detector -run TestCanary -v -count=1 -timeout 600s

  worktree-macos:
    # Dependency isolation takes two different paths and ubuntu only exercises
    # one: ext4 has no reflink, so --reflink=always fails there and every run
    # falls back to hardlinks. APFS clones, so DepsCOW -- the path that gives
    # full isolation -- is only ever executed here. Without this job the mode
    # most users get is covered by nobody.
    runs-on: macos-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: fixture deps (ts-vitest)
        run: npm install --prefix testdata/fixtures/ts-vitest --no-audit --no-fund
      - name: worktree + scheduler isolation tests (COW path)
        run: go test ./internal/worktree ./internal/scheduler -count=1 -timeout 15m
      - name: confirm this runner actually took the clone path
        # A silent downgrade to hardlinks would leave this job green while
        # covering nothing new, so assert the filesystem really clones rather
        # than assuming macOS implies APFS.
        run: |
          src=$(mktemp -d); dst=$(mktemp -d)/clone
          echo original > "$src/f"
          cp -c -R "$src" "$dst"
          printf 'mutated' | dd of="$dst/f" conv=notrunc status=none
          if [ "$(cat "$src/f")" != "original" ]; then
            echo "FAIL: cp -c shared the inode; this runner is not exercising DepsCOW" >&2
            exit 1
          fi
          echo "confirmed: cp -c produces independent inodes (DepsCOW path is live)"

  npm-wrapper:
    # Publish-path validation: pack the wrapper + platform package and run the
    # CLI through the packed artifacts (a symlink would not prove this).
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm roundtrip (pack + install + run)
        run: bash scripts/npm/roundtrip.sh

